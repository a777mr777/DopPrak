workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"

stages:
  - secrets
  - build
  - test
  - fuzz

# ========== ДОП ЗАДАНИЕ 1: GITLEAKS (ПОИСК СЕКРЕТОВ) ==========
gitleaks-scan:
  stage: secrets
  image: zricethezav/gitleaks:latest
  script:
    - gitleaks detect --source . --no-git -v --redact
  allow_failure: false

# ========== ТВОЙ СУЩЕСТВУЮЩИЙ BUILD ==========
maven-build:
  stage: build
  needs: []
  script:
    - ./mvnw.cmd -B clean test package
  artifacts:
    paths:
      - target/*.jar

# ========== ТВОЙ СУЩЕСТВУЮЩИЙ SAST ==========
semgrep-sast:
  stage: test
  variables:
    PYTHONUTF8: "1"
    PYTHONIOENCODING: "utf-8"
  script:
    - $env:Path += ";$env:APPDATA\Python\Python314\Scripts"
    - semgrep scan --config auto --gitlab-sast -o gl-sast-report.json .
  allow_failure: true
  artifacts:
    when: always
    reports:
      sast: gl-sast-report.json

# ========== ТВОЙ СУЩЕСТВУЮЩИЙ DEPENDENCY CHECK ==========
dependency-check:
  stage: test
  timeout: 2h
  script:
    - ./mvnw.cmd dependency-check:check -DretireJsAnalyzerEnabled=false -Dformat=HTML "-DsuppressionFiles=dependency-check-suppression.xml"
  allow_failure: true
  artifacts:
    when: always
    paths:
      - target/dependency-check-report.html

# ========== ТВОЙ СУЩЕСТВУЮЩИЙ DAST ==========
dast-baseline:
  stage: test
  needs:
    - job: maven-build
      artifacts: true
  script:
    - $env:ZAP_PATH = "C:\ZAP\ZAP_D-2026-03-18"
    - Start-Process -NoNewWindow -FilePath java -ArgumentList "-jar", (Get-Item target\*.jar).FullName
    - Start-Sleep -Seconds 30
    - python "$env:ZAP_PATH\zap-baseline.py" -t http://localhost:8080 -r zap-baseline-report.html -c rules.tsv; exit 0
  allow_failure: true
  artifacts:
    when: always
    paths:
      - zap-baseline-report.html

dast-api:
  stage: test
  needs:
    - job: maven-build
      artifacts: true
  script:
    - $env:ZAP_PATH = "C:\ZAP\ZAP_D-2026-03-18"
    - Start-Process -NoNewWindow -FilePath java -ArgumentList "-jar", (Get-Item target\*.jar).FullName
    - Start-Sleep -Seconds 30
    - python "$env:ZAP_PATH\zap-api-scan.py" -t http://localhost:8080/v3/api-docs -f openapi -r zap-api-report.html -c rules.tsv; exit 0
  allow_failure: true
  artifacts:
    when: always
    paths:
      - zap-api-report.html

# ========== ДОП ЗАДАНИЕ 2: ФАЗЗИНГ (FFUF) ДЛЯ WINDOWS ==========
web-fuzzing:
  stage: fuzz
  needs:
    - job: maven-build
      artifacts: true
    - job: dast-baseline
  script:
    - choco install ffuf -y
    - $env:Path += ";C:\ProgramData\chocolatey\bin"
    - Start-Process -NoNewWindow -FilePath java -ArgumentList "-jar", (Get-Item target\*.jar).FullName
    - Start-Sleep -Seconds 45
    - "login`nregister`ncourses`nstudents`nadmin`nxml`nconfig`napi`nuser`npassword`nroot" | Out-File -FilePath wordlist.txt -Encoding ASCII
    - ffuf -u http://localhost:8080/api/FUZZ -w wordlist.txt -mc all -o fuzz-report.json
  allow_failure: true
  artifacts:
    when: always
    paths:
      - fuzz-report.json
